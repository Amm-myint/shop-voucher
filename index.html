<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ဆိုင်ဘောင်ချာ</title>

    <!-- Myanmar Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
            color: #333;
            font-family: "Noto Sans Myanmar", sans-serif;
        }

        .container {
            max-width: 760px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,.08);
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }

        .form-row {
            display: flex;
            gap: 12px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 15px;
        }

        .item-name {
            flex: 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 44px;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2980b9;
        }

        hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 20px 0;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 7px;
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            padding: 13px;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .btn-add {
            background: #2980b9;
            margin-bottom: 20px;
        }

        .btn-add:hover {
            background: #216a99;
        }

        .btn-pdf {
            background: #e67e22;
            margin-top: 20px;
        }

        .btn-pdf:hover {
            background: #d35400;
        }

        /* ===============================
           VOUCHER
        =============================== */

        #printableVoucher {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            margin-top: 10px;
        }

        .voucher-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .voucher-header h3 {
            margin: 0;
            color: #2c3e50;
            font-size: 27px;
        }

        .voucher-header p {
            margin: 5px 0 0;
        }

        .voucher-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
        }

        th {
            background: #2980b9;
            color: white;
            text-align: center;
        }

        td {
            background: white;
        }

        .center {
            text-align: center;
        }

        .right {
            text-align: right;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .total-section {
            text-align: right;
            font-size: 17px;
            font-weight: 700;
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            #printableVoucher {
                padding: 12px;
            }

            .voucher-header h3 {
                font-size: 21px;
            }

            th,
            td {
                padding: 7px 5px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h2>ဆိုင်ဘောင်ချာ ထုတ်ပေးသည့်စနစ်</h2>


    <!-- =========================
         SHOP
    ========================== -->

    <div class="form-row">

        <div class="form-group">

            <label>ဆိုင်အမည်</label>

            <input
                type="text"
                id="shopName"
                placeholder="ဥပမာ - ရွှေစင် စတိုး"
                oninput="updateHeader()"
            >

        </div>


        <div class="form-group">

            <label>ဖုန်းနံပါတ်</label>

            <input
                type="text"
                id="shopPhone"
                placeholder="09xxxxxxxxx"
                oninput="updateHeader()"
            >

        </div>

    </div>


    <!-- =========================
         CUSTOMER
    ========================== -->

    <div class="form-group">

        <label>ဝယ်ယူသူအမည်</label>

        <input
            type="text"
            id="custName"
            placeholder="ဝယ်ယူသူအမည်"
            oninput="updateHeader()"
        >

    </div>


    <hr>


    <!-- =========================
         ITEM INPUT
    ========================== -->

    <div class="form-row">

        <div class="form-group item-name">

            <label>အမျိုးအမည်</label>

            <input
                type="text"
                id="itemName"
                placeholder="ပစ္စည်းအမည်"
            >

        </div>


        <div class="form-group">

            <label>ခုရေ</label>

            <input
                type="number"
                id="itemQty"
                placeholder="1"
                min="1"
            >

        </div>


        <div class="form-group">

            <label>စျေးနှုန်း (MMK)</label>

            <input
                type="number"
                id="itemPrice"
                placeholder="1000"
                min="0"
            >

        </div>

    </div>


    <!-- ADD BUTTON -->
    <button
        type="button"
        class="btn-add"
        onclick="addItem()"
    >
        + ပစ္စည်းထည့်မည်
    </button>


    <!-- =========================
         VOUCHER
    ========================== -->

    <div id="printableVoucher">

        <div class="voucher-header">

            <h3 id="displayShopName">
                ဆိုင်အမည်
            </h3>

            <p id="displayShopPhone"></p>

        </div>


        <div class="voucher-info">

            <span id="displayCustName">
                ဝယ်ယူသူ -
            </span>

            <span id="displayDate"></span>

        </div>


        <table>

            <thead>

                <tr>

                    <th>
                        အမျိုးအမည်
                    </th>

                    <th width="12%">
                        ခုရေ
                    </th>

                    <th width="25%">
                        စျေးနှုန်း
                    </th>

                    <th width="25%">
                        ကျသင့်ငွေ
                    </th>

                </tr>

            </thead>


            <tbody id="voucherBody">

                <tr>

                    <td
                        colspan="4"
                        class="empty"
                    >
                        ပစ္စည်းထည့်ရန်
                    </td>

                </tr>

            </tbody>

        </table>


        <div class="total-section">

            စုစုပေါင်း ကျသင့်ငွေ -

            <span id="grandTotal">
                0
            </span>

            MMK

        </div>

    </div>


    <!-- PDF BUTTON -->

    <button
        type="button"
        class="btn-pdf"
        onclick="generatePDF()"
    >
        PDF ဘောင်ချာ ဒေါင်းလုဒ်ဆွဲမည်
    </button>

</div>


<!-- =========================
     LIBRARIES
========================= -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
</script>

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

"use strict";


// ==========================================
// DATA
// ==========================================

let items = [];


// ==========================================
// NUMBER FORMAT
// ==========================================

function formatMoney(value) {

    return Number(value).toLocaleString(
        "en-US",
        {
            maximumFractionDigits: 2
        }
    );

}


// ==========================================
// UPDATE HEADER
// ==========================================

function updateHeader() {

    const shopName =
        document.getElementById("shopName").value.trim();

    const shopPhone =
        document.getElementById("shopPhone").value.trim();

    const custName =
        document.getElementById("custName").value.trim();


    document.getElementById(
        "displayShopName"
    ).textContent =
        shopName || "ဆိုင်အမည်";


    document.getElementById(
        "displayShopPhone"
    ).textContent =
        shopPhone
            ? "ဖုန်း - " + shopPhone
            : "";


    document.getElementById(
        "displayCustName"
    ).textContent =
        custName
            ? "ဝယ်ယူသူ - " + custName
            : "ဝယ်ယူသူ -";


    const today = new Date();

    const date =
        today.toLocaleDateString("en-GB");


    document.getElementById(
        "displayDate"
    ).textContent =
        "ရက်စွဲ - " + date;

}


// ==========================================
// ADD ITEM
// ==========================================

function addItem() {

    const nameInput =
        document.getElementById("itemName");

    const qtyInput =
        document.getElementById("itemQty");

    const priceInput =
        document.getElementById("itemPrice");


    const name =
        nameInput.value.trim();

    const qty =
        Number(qtyInput.value);

    const price =
        Number(priceInput.value);


    // Validation

    if (name === "") {

        alert(
            "ပစ္စည်းအမည် ဖြည့်ပေးပါ။"
        );

        nameInput.focus();

        return;
    }


    if (!Number.isFinite(qty) || qty <= 0) {

        alert(
            "အရေအတွက် မှန်ကန်စွာ ဖြည့်ပေးပါ။"
        );

        qtyInput.focus();

        return;
    }


    if (!Number.isFinite(price) || price <= 0) {

        alert(
            "စျေးနှုန်း မှန်ကန်စွာ ဖြည့်ပေးပါ။"
        );

        priceInput.focus();

        return;
    }


    // Calculate

    const subtotal =
        qty * price;


    // Add

    items.push({
        name: name,
        qty: qty,
        price: price,
        subtotal: subtotal
    });


    // Update

    updateTable();


    // Clear

    nameInput.value = "";
    qtyInput.value = "";
    priceInput.value = "";


    // Focus

    nameInput.focus();

}


// ==========================================
// UPDATE TABLE
// ==========================================

function updateTable() {

    const tbody =
        document.getElementById(
            "voucherBody"
        );


    tbody.innerHTML = "";


    // Empty

    if (items.length === 0) {

        tbody.innerHTML = `
            <tr>
                <td
                    colspan="4"
                    class="empty"
                >
                    ပစ္စည်းထည့်ရန်
                </td>
            </tr>
        `;

        document.getElementById(
            "grandTotal"
        ).textContent = "0";

        return;
    }


    let total = 0;


    items.forEach(function(item) {

        total += item.subtotal;


        const row =
            document.createElement("tr");


        // Name

        const nameCell =
            document.createElement("td");

        nameCell.textContent =
            item.name;


        // Quantity

        const qtyCell =
            document.createElement("td");

        qtyCell.textContent =
            formatMoney(item.qty);

        qtyCell.className =
            "center";


        // Price

        const priceCell =
            document.createElement("td");

        priceCell.textContent =
            formatMoney(item.price) + " MMK";

        priceCell.className =
            "right";


        // Subtotal

        const subtotalCell =
            document.createElement("td");

        subtotalCell.textContent =
            formatMoney(item.subtotal) + " MMK";

        subtotalCell.className =
            "right";


        row.appendChild(nameCell);

        row.appendChild(qtyCell);

        row.appendChild(priceCell);

        row.appendChild(subtotalCell);


        tbody.appendChild(row);

    });


    // Total

    document.getElementById(
        "grandTotal"
    ).textContent =
        formatMoney(total);

}


// ==========================================
// GENERATE PDF
// ==========================================

async function generatePDF() {

    if (items.length === 0) {

        alert(
            "PDF မထုတ်ခင် ပစ္စည်းအနည်းဆုံး ၁ ခု ထည့်ပေးပါ။"
        );

        return;
    }


    if (
        typeof html2canvas ===
        "undefined"
    ) {

        alert(
            "html2canvas မတက်ပါ။ Internet connection စစ်ပေးပါ။"
        );

        return;
    }


    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(
            "jsPDF မတက်ပါ။ Internet connection စစ်ပေးပါ။"
        );

        return;
    }


    const voucher =
        document.getElementById(
            "printableVoucher"
        );


    const button =
        document.querySelector(
            ".btn-pdf"
        );


    try {

        // Loading

        button.disabled = true;

        button.textContent =
            "PDF ပြုလုပ်နေပါသည်...";


        // Wait for font

        if (document.fonts) {

            await document.fonts.ready;

        }


        // Canvas

        const canvas =
            await html2canvas(
                voucher,
                {
                    scale: 2,
                    useCORS: true,
                    backgroundColor: "#ffffff",
                    logging: false
                }
            );


        const image =
            canvas.toDataURL(
                "image/png"
            );


        // PDF

        const PDF =
            window.jspdf.jsPDF;


        const pdf =
            new PDF(
                "p",
                "mm",
                "a4"
            );


        const pageWidth =
            pdf.internal.pageSize.getWidth();

        const pageHeight =
            pdf.internal.pageSize.getHeight();


        const margin = 10;


        const width =
            pageWidth -
            margin * 2;


        let height =
            canvas.height *
            width /
            canvas.width;


        const maxHeight =
            pageHeight -
            margin * 2;


        if (height > maxHeight) {

            height =
                maxHeight;

        }


        pdf.addImage(
            image,
            "PNG",
            margin,
            margin,
            width,
            height
        );


        // Filename

        const shopName =
            document.getElementById(
                "shopName"
            ).value.trim();


        let fileName =
            shopName || "Shop";


        fileName =
            fileName
                .replace(
                    /[\\/:*?"<>|]/g,
                    "_"
                )
                .replace(
                    /\s+/g,
                    "_"
                );


        const date =
            new Date()
                .toISOString()
                .slice(0, 10);


        pdf.save(
            fileName +
            "_Voucher_" +
            date +
            ".pdf"
        );


    } catch (error) {

        console.error(error);

        alert(
            "PDF ထုတ်ရာတွင် Error ဖြစ်နေပါသည်။\n\n" +
            error.message
        );


    } finally {

        button.disabled = false;

        button.textContent =
            "PDF ဘောင်ချာ ဒေါင်းလုဒ်ဆွဲမည်";

    }

}


// ==========================================
// ENTER KEY
// ==========================================

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            (
                document.activeElement.id ===
                "itemName" ||

                document.activeElement.id ===
                "itemQty" ||

                document.activeElement.id ===
                "itemPrice"
            )
        ) {

            event.preventDefault();

            addItem();

        }

    }
);


// ==========================================
// START
// ==========================================

updateHeader();

updateTable();

</script>

</body>
</html>
